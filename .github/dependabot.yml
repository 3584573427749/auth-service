version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

    ignore:
      - dependency-name: "php"
        update-types:
          - "version-update:semver-minor"